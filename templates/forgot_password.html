{% extends 'base.html' %}
{% block title %}{{ _('Reset password') }}{% endblock %}
{% block content %}<section class="auth-wrap container"><div class="auth-card" style="max-width: 470px; width: 100%;"><div class="auth-header"><span class="eyebrow">{{ _('ACCOUNT RECOVERY') }}</span><h1>{{ _('Reset your password.') }}</h1><p>{{ _('We will help you get back into your workspace.') }}</p></div><div class="auth-body"><form method="POST" action="{{ url_for('forgot_password') }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="mb-4"><label class="form-label" for="email">{{ _('Work email') }}</label><input class="form-control" id="email" name="email" type="email" required autocomplete="email"></div><button class="button button-primary w-100" type="submit">{{ _('Send reset link') }} <i class="fa-solid fa-arrow-left"></i></button></form><p class="helper text-center mt-4 mb-0"><a href="{{ url_for('login') }}">{{ _('Back to sign in') }}</a></p></div></div></section>{% endblock %}
