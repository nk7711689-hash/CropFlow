{% extends 'base.html' %}
{% block title %}{{ _('Edit crop') }}{% endblock %}
{% block content %}
<section class="auth-wrap container"><div class="auth-card auth-card-wide"><div class="auth-header"><span class="eyebrow">{{ _('SUPPLIER WORKSPACE') }}</span><h1>{{ _('Edit crop') }}</h1><p>{{ product.name }}</p></div><div class="auth-body"><form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}" enctype="multipart/form-data"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">{{ _('Crop name') }}</label><input class="form-control" id="name" name="name" value="{{ product.name }}" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="quantity">{{ _('Available quantity (kg)') }}</label><input class="form-control" id="quantity" name="quantity" type="number" min="0.01" step="0.01" value="{{ product.quantity }}" required></div><div class="col-md-6 mb-3"><label class="form-label" for="price">{{ _('Price per kg (SAR)') }}</label><input class="form-control" id="price" name="price" type="number" min="0" step="0.01" value="{{ product.price }}" required></div></div><div class="mb-3"><label class="form-label" for="min_order_quantity">{{ _('Minimum order (kg)') }}</label><input class="form-control" id="min_order_quantity" name="min_order_quantity" type="number" min="0.01" step="0.01" value="{{ product.min_order_quantity }}" required></div><div class="mb-3"><label class="form-label" for="expiry_date">{{ _('Available until') }}</label><input class="form-control" id="expiry_date" name="expiry_date" type="date" value="{{ product.expiry_date.isoformat() }}" required></div><div class="mb-4"><label class="form-label" for="images">{{ _('Add more images') }}</label><input class="form-control" id="images" name="images" type="file" accept=".jpg,.jpeg,.png,.webp" multiple></div><button class="button button-primary w-100" type="submit">{{ _('Save crop changes') }} <i class="fa-solid fa-arrow-left"></i></button></form></div></div></section>
{% endblock %}
